buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://repo.dairy.foundation/releases' }
    }
    dependencies {
        // Load 0.3.2 uses ExecOperations, which is compatible with Gradle 9.
        classpath 'dev.frozenmilk:Load:0.3.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

load {
    // Use the existing USB/Wi-Fi ADB connection. The default auto-connect mode
    // can wait indefinitely when the robot at 192.168.43.1 is unavailable.
    autoconnect = dev.frozenmilk.sinister.sloth.AutoConnect.valueOf('NEVER')
}

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    sourceSets {
        main {
            java {
                exclude '**/VisionSubsystem.kt'
            }
        }
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }
}

kotlin {
    // Keep compilation and host tests on the FTC-supported JDK, even on newer Macs.
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

repositories {
    maven { url = 'https://repo.dairy.foundation/releases' }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'dev.nextftc:ftc:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}
